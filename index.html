<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 나만의 포켓몬 찾기</title>
    <style>
        :root {
            --bg-primary: #FFFDF0;
            --bg-card: #FFFFFF;
            --accent-yellow: #FFDE59;
            --accent-hover: #F2C94C;
            --accent-orange: #FF914D;
            --text-main: #4A3E3D;
            --text-sub: #7A6867;
            --border-color: #F0E6D2;
            --shadow: 0 8px 24px rgba(149, 117, 83, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--bg-card);
            border-radius: 28px;
            padding: 36px 28px;
            box-shadow: var(--shadow);
            border: 3px solid var(--border-color);
            text-align: center;
            transition: all 0.3s ease;
        }

        header h1 {
            font-size: 1.9rem;
            color: var(--text-main);
            margin-bottom: 10px;
            word-break: keep-all;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 28px;
            word-break: keep-all;
        }

        /* MBTI 그리드 레이아웃 */
        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        .mbti-btn {
            background-color: #FFF8DC;
            border: 2px solid #F5E6B3;
            border-radius: 16px;
            padding: 16px 8px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .mbti-btn span.desc {
            font-size: 0.8rem;
            font-weight: normal;
            color: var(--text-sub);
        }

        .mbti-btn:hover {
            background-color: var(--accent-yellow);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255, 222, 89, 0.4);
            border-color: var(--accent-hover);
        }

        .mbti-btn:active {
            transform: translateY(0);
        }

        /* 결과 화면 디자인 */
        .result-card {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-yellow);
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .pokemon-emoji {
            font-size: 6.5rem;
            line-height: 1;
            margin: 15px 0;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.1));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .pokemon-name {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .reason-box {
            background-color: #FFFDF5;
            border: 2px dashed #F2D283;
            border-radius: 18px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .reason-box p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-main);
            word-break: keep-all;
        }

        .match-box {
            background-color: #FFF3E0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .match-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--accent-orange);
        }

        .match-content {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .reset-btn {
            background-color: var(--accent-orange);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 145, 77, 0.3);
            width: 100%;
            max-width: 280px;
        }

        .reset-btn:hover {
            background-color: #E07A38;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 145, 77, 0.4);
        }

        .reset-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MBTI 선택 화면 -->
    <div id="selection-view">
        <header>
            <h1>⚡ MBTI로 나만의 포켓몬 찾기 🌿</h1>
            <p>당신의 MBTI 성격 유형을 선택해보세요!</p>
        </header>

        <div class="mbti-grid" id="mbti-grid">
            <!-- JS로 버튼이 동적 생성됩니다 -->
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-view" class="result-card">
        <div class="badge" id="res-mbti">ISTJ</div>
        <div class="pokemon-emoji" id="res-emoji">🐢</div>
        <div class="pokemon-name" id="res-name">거북왕</div>
        
        <div class="reason-box">
            <p id="res-reason">어울리는 이유가 들어갑니다.</p>
        </div>

        <div class="match-box">
            <span class="match-title">❤️ 환상의 궁합:</span>
            <span class="match-content" id="res-match">ENFP (토게피 🥚)</span>
        </div>

        <button class="reset-btn" onclick="resetSelection()">🔄 다시 고르기</button>
    </div>
</div>

<script>
    // MBTI별 포켓몬 데이터 정의
    const pokemonData = {
        "ISTJ": {
            name: "거북왕",
            emoji: "🐢",
            reason: "신중하고 책임감이 강하여 한 번 맡은 일은 끝까지 완수합니다. 거북왕처럼 묵묵하고 단단하게 주변을 지키는 든든한 파트너입니다.",
            match: "ENFP (토게피 🥚)"
        },
        "ISFJ": {
            name: "해피너스",
            emoji: "💗",
            reason: "따뜻하고 상냥한 마음씨로 타인을 배려하는 평화주의자입니다. 상처받은 포켓몬을 다정하게 치료해주는 해피너스와 꼭 닮았습니다.",
            match: "ENTP (로토무 ⚡)"
        },
        "INFJ": {
            name: "뮤",
            emoji: "✨",
            reason: "신비롭고 깊은 통찰력을 가지고 있으며, 자신만의 이상을 품고 살아갑니다. 세상의 근원을 품은 희귀하고 순수한 뮤와 같은 감성을 지녔습니다.",
            match: "ESTP (피카츄 ⚡)"
        },
        "INTJ": {
            name: "뮤츠",
            emoji: "🧠",
            reason: "뛰어난 지능과 냉철한 분석력으로 목표를 완벽하게 달성합니다. 스스로 최고가 되기 위해 정진하는 완벽주의자 뮤츠와 높은 싱크로율을 자랑합니다.",
            match: "ESFP (푸린 🎤)"
        },
        "ISTP": {
            name: "루카리오",
            emoji: "🥋",
            reason: "위기 상황에서도 냉철한 판단력을 발휘하며 실전에 강합니다. 파동을 느끼고 과묵하게 승리를 이끌어내는 루카리오처럼 도도하고 유능합니다.",
            match: "ENFJ (망나뇽 🐉)"
        },
        "ISFP": {
            name: "메타몽",
            emoji: "🎨",
            reason: "유연하고 온화하며 어디서든 상황에 맞게 잘 적응합니다. 어떤 모습으로든 변신할 수 있는 예술가적 자유로움을 가진 메타몽과 어울립니다.",
            match: "ENTJ (리자몽 🔥)"
        },
        "INFP": {
            name: "이브이",
            emoji: "🌟",
            reason: "무한한 가능성과 따뜻한 감성을 품고 있는 꿈꾸는 이상가입니다. 어떤 환경과 마음가짐에 따라 다채롭게 진화하는 이브이 그 자체입니다.",
            match: "ESTJ (윈디 🦁)"
        },
        "INTP": {
            name: "팬텀",
            emoji: "👻",
            reason: "호기심이 많고 엉뚱하면서도 기발한 창의력을 자랑하는 아이디어 파크입니다. 예측 불허의 호기심과 지적 탐구심을 가진 팬텀과 닮았습니다.",
            match: "ESFJ (라이츄 ⚡)"
        },
        "ESTP": {
            name: "피카츄",
            emoji: "⚡",
            reason: "에너지가 넘치고 순발력이 뛰어나며 순식간에 행동에 나서는 모험가입니다. 어디서나 밝고 당당하게 전기를 뿜어내는 피카츄의 매력을 가졌습니다.",
            match: "INFJ (뮤 ✨)"
        },
        "ESFP": {
            name: "푸린",
            emoji: "🎤",
            reason: "어디서나 분위기를 밝게 만드는 스포트라이트의 주인공입니다. 사랑스러운 매력과 노래로 모두의 시선을 사로잡는 분위기 메이커 푸린입니다.",
            match: "INTJ (뮤츠 🧠)"
        },
        "ENFP": {
            name: "토게피",
            emoji: "🥚",
            reason: "행복과 긍정적인 에너지를 주위에 뿜어내는 호기심 대장입니다. 통통 튀는 아이디어와 따뜻한 마음으로 모두를 미소 짓게 만드는 토게피입니다.",
            match: "ISTJ (거북왕 🐢)"
        },
        "ENTP": {
            name: "로토무",
            emoji: "⚡",
            reason: "재치 넘치고 새로운 도전을 즐기는 창의적인 솔루션 제시자입니다. 가전제품을 넘나들며 변신하는 다재다능한 로토무처럼 순발력이 넘칩니다.",
            match: "ISFJ (해피너스 💗)"
        },
        "ESTJ": {
            name: "윈디",
            emoji: "🦁",
            reason: "솔선수범하는 리더십과 강한 책임감으로 무리를 이끕니다. 위풍당당한 기상과 신뢰할 수 있는 든든함을 갖춘 전설의 포켓몬 윈디와 같습니다.",
            match: "INFP (이브이 🌟)"
        },
        "ESFJ": {
            name: "라이츄",
            emoji: "⚡",
            reason: "다정다감하고 친화력이 좋아 동료들과 어울리는 것을 좋아합니다. 따뜻한 성격으로 주변 사람들을 살뜰히 챙기는 친절한 라이츄 타입입니다.",
            match: "INTP (팬텀 👻)"
        },
        "ENFJ": {
            name: "망나뇽",
            emoji: "🐉",
            reason: "넓은 포용력과 따뜻한 마음으로 모두를 아우르는 조력자입니다. 거친 바다에서도 사람을 구하는 따뜻하고 든든한 망나뇽처럼 성인군자형입니다.",
            match: "ISTP (루카리오 🥋)"
        },
        "ENTJ": {
            name: "리자몽",
            emoji: "🔥",
            reason: "원대한 목표를 향해 열정적으로 진격하는 대담한 리더입니다. 불타오르는 승부욕과 추진력으로 앞장서서 나아가는 리자몽의 기상을 가지고 있습니다.",
            match: "ISFP (메타몽 🎨)"
        }
    };

    const mbtiList = Object.keys(pokemonData);

    // 페이지 로드 시 MBTI 버튼 생성
    function initButtons() {
        const grid = document.getElementById('mbti-grid');
        grid.innerHTML = '';
        
        mbtiList.forEach(mbti => {
            const btn = document.createElement('button');
            btn.className = 'mbti-btn';
            btn.innerHTML = `
                ${mbti}
            `;
            btn.onclick = () => selectMBTI(mbti);
            grid.appendChild(btn);
        });
    }

    // MBTI 선택 시 결과 표시
    function selectMBTI(mbti) {
        const data = pokemonData[mbti];
        if (!data) return;

        document.getElementById('res-mbti').innerText = mbti;
        document.getElementById('res-emoji').innerText = data.emoji;
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('res-reason').innerText = data.reason;
        document.getElementById('res-match').innerText = data.match;

        document.getElementById('selection-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';
        
        // 스크롤 상단 이동
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 초기화 함수
    function resetSelection() {
        document.getElementById('result-view').style.display = 'none';
        document.getElementById('selection-view').style.display = 'block';
    }

    // 실행
    window.onload = initButtons;
</script>

</body>
</html>
